<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Presencia Digital</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para los logos exactos a color de las apps -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #030306;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#030306]">

  <!-- Contenido principal de tu página (podes meter tu portafolio acá arriba) -->
  <main class="flex-grow flex items-center justify-center p-6">
    <!-- Espacio para tu contenido principal existente -->
  </main>

  <!-- SECCIÓN FINAL: REDES SOCIALES ULTRA-MINIMALISTAS -->
  <footer class="w-full py-10 border-t border-white/[0.03] bg-[#030306]">
    <div class="max-w-xl mx-auto px-6 flex flex-row items-center justify-center gap-8 md:gap-12 flex-wrap">
      
      <!-- Enlace Instagram -->
      <a href="https://www.instagram.com/victor_hugossj/" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 opacity-80 hover:opacity-100 transition-all group">
        <i class="fa-brands fa-instagram text-xl bg-gradient-to-tr from-[#f9ce34] via-[#ee2a7b] to-[#6228d7] bg-clip-text text-transparent"></i>
        <span class="text-sm font-medium tracking-tight text-neutral-300 group-hover:text-white transition-colors">Instagram</span>
      </a>

      <!-- Enlace TikTok -->
      <a href="https://www.tiktok.com/@victor_hugossj" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 opacity-80 hover:opacity-100 transition-all group">
        <!-- Icono con el efecto de color original de TikTok -->
        <span class="relative text-xl flex items-center justify-center">
          <i class="fa-brands fa-tiktok text-white relative z-10"></i>
          <i class="fa-brands fa-tiktok text-[#00f2fe] absolute -top-[1px] -left-[1px] opacity-70"></i>
          <i class="fa-brands fa-tiktok text-[#fe0979] absolute top-[1px] left-[1px] opacity-70"></i>
        </span>
        <span class="text-sm font-medium tracking-tight text-neutral-300 group-hover:text-white transition-colors">TikTok</span>
      </a>

      <!-- Enlace WhatsApp -->
      <a href="https://wa.me/595995648052" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 opacity-80 hover:opacity-100 transition-all group">
        <i class="fa-brands fa-whatsapp text-xl text-[#25D366]"></i>
        <span class="text-sm font-medium tracking-tight text-neutral-300 group-hover:text-white transition-colors">WhatsApp</span>
      </a>

    </div>
  </footer>

</body>
</html>
