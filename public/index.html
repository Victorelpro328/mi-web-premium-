<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Presencia Digital</title>
  <!-- Tailwind CSS para los estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Desarrollo de Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #030306;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center bg-[#030306]">

  <!-- 6. SECCIÓN: SOCIAL HUB (MINIMALISTA) -->
  <section id="social" class="w-full px-6 py-16 max-w-4xl mx-auto relative z-10">
    <div class="text-center space-y-2 mb-10">
      <h2 class="text-[11px] uppercase tracking-widest text-violet-400 font-bold">Comunidad & Contenido</h2>
      <p class="text-2xl font-bold tracking-tight">Presencia Digital</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Tarjeta TikTok -->
      <a href="https://www.tiktok.com/@victor_hugossj" target="_blank" rel="noopener noreferrer" class="social-card bg-[#030306]/80 border border-white/[0.05] rounded-xl p-5 flex items-center gap-4 hover:border-pink-500/40 transition-all group cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-pink-500/10 border border-pink-500/20 flex items-center justify-center group-hover:bg-pink-500/20 transition-all shrink-0">
          <i data-lucide="video" class="w-5 h-5 text-pink-400"></i>
        </div>
        <h3 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
          TikTok <span class="text-xs font-normal text-neutral-500 group-hover:translate-x-1 transition-transform">→</span>
        </h3>
      </a>

      <!-- Tarjeta Instagram -->
      <a href="https://www.instagram.com/victor_hugossj/" target="_blank" rel="noopener noreferrer" class="social-card bg-[#030306]/80 border border-white/[0.05] rounded-xl p-5 flex items-center gap-4 hover:border-indigo-400/40 transition-all group cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center group-hover:bg-indigo-500/20 transition-all shrink-0">
          <i data-lucide="instagram" class="w-5 h-5 text-indigo-400"></i>
        </div>
        <h3 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
          Instagram <span class="text-xs font-normal text-neutral-500 group-hover:translate-x-1 transition-transform">→</span>
        </h3>
      </a>

      <!-- Tarjeta WhatsApp -->
      <a href="https://wa.me/595995648052?text=Hola!%20Vengo%20de%20tu%20portafolio." target="_blank" rel="noopener noreferrer" class="social-card bg-[#030306]/80 border border-white/[0.05] rounded-xl p-5 flex items-center gap-4 hover:border-emerald-400/40 transition-all group cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center group-hover:bg-emerald-500/20 transition-all shrink-0">
          <i data-lucide="message-circle" class="w-5 h-5 text-emerald-400"></i>
        </div>
        <h3 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
          WhatsApp <span class="text-xs font-normal text-neutral-500 group-hover:translate-x-1 transition-transform">→</span>
        </h3>
      </a>

    </div>
  </section>

  <!-- Script obligatorio para que carguen los iconos de Lucide -->
  <script>
    lucide.createIcons();
  </script>

</body>
</html>
